services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fuellog
      POSTGRES_USER: fuellog
      POSTGRES_PASSWORD: ${FUELLOG_DB_PASSWORD:?Defina FUELLOG_DB_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fuellog -d fuellog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
