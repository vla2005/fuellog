spring.application.name=fuellog-api
spring.datasource.url=${FUELLOG_DB_URL:jdbc:postgresql://localhost:5432/fuellog}
spring.datasource.username=${FUELLOG_DB_USER:fuellog}
spring.datasource.password=${FUELLOG_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
