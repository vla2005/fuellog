spring.application.name=fuellog-api
spring.mail.host=${FUELLOG_MAIL_HOST:}
spring.mail.port=${FUELLOG_MAIL_PORT:587}
spring.mail.username=${FUELLOG_MAIL_USERNAME:}
spring.mail.password=${FUELLOG_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${FUELLOG_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${FUELLOG_MAIL_SSL_ENABLED:false}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.starttls.enable=${FUELLOG_MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=${FUELLOG_MAIL_STARTTLS_ENABLED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
# Registration delivery is optional; SMTP availability must not take existing logins out of service.
management.health.mail.enabled=false
fuellog.registration.mail-from=${FUELLOG_MAIL_FROM:}
# Count connector peers; forwarded headers require a separate trusted-proxy policy.
server.forward-headers-strategy=none
fuellog.security.login-rate-limit.account-attempts=${FUELLOG_LOGIN_ACCOUNT_ATTEMPTS:10}
fuellog.security.login-rate-limit.source-attempts=${FUELLOG_LOGIN_SOURCE_ATTEMPTS:100}
fuellog.security.login-rate-limit.window-seconds=${FUELLOG_LOGIN_WINDOW_SECONDS:300}
fuellog.security.login-rate-limit.max-scopes=${FUELLOG_LOGIN_MAX_SCOPES:50000}
fuellog.security.totp-encryption-key-base64=${FUELLOG_SECURITY_TOTP_ENCRYPTION_KEY_BASE64:}
fuellog.vikash.enabled=${FUELLOG_VIKASH_ENABLED:false}
fuellog.vikash.base-url=${FUELLOG_VIKASH_BASE_URL:}
fuellog.vikash.client-id=${FUELLOG_VIKASH_CLIENT_ID:fuellog}
fuellog.vikash.client-secret=${FUELLOG_VIKASH_CLIENT_SECRET:}
fuellog.vikash.callback-url=${FUELLOG_VIKASH_CALLBACK_URL:}
fuellog.vikash.web-return-url=${FUELLOG_VIKASH_WEB_RETURN_URL:}
fuellog.vikash.native-return-url=${FUELLOG_VIKASH_NATIVE_RETURN_URL:}
fuellog.vikash.encryption-key-base64=${FUELLOG_VIKASH_ENCRYPTION_KEY_BASE64:}
spring.datasource.url=${FUELLOG_DB_URL:jdbc:postgresql://localhost:5432/fuellog}
spring.datasource.username=${FUELLOG_DB_USER:fuellog}
spring.datasource.password=${FUELLOG_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
fuellog.cors.allowed-origins=${FUELLOG_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
